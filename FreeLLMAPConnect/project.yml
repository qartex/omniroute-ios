name: FreeLLMAPConnect
options:
  minimumXcodeGenVersion: 2.42.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: NXD4CMA7AY
    CURRENT_PROJECT_VERSION: 11
    MARKETING_VERSION: 2.0.0
targets:
  FreeLLMAPConnect:
    type: application
    platform: iOS
    sources:
      - path: Sources/GatewayHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qartex.freellmapconnect
        PRODUCT_NAME: FreeLLMAPConnect
        PRODUCT_MODULE_NAME: FreeLLMAPConnect
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gateway Hub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        # OmniRoute is currently exposed at an HTTP IP address. The app warns users
        # before allowing it; use HTTPS for every public production instance.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    scheme:
      testTargets:
        - FreeLLMAPConnectTests
  FreeLLMAPConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FreeLLMAPConnect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FreeLLMAPConnect.app/FreeLLMAPConnect"
        BUNDLE_LOADER: "$(TEST_HOST)"
